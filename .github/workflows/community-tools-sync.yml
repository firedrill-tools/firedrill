name: Community Tool catalog sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      community_sha:
        description: Exact firedrill-community-tools commit to import
        required: true
        type: string
  repository_dispatch:
    types:
      - community-tools-updated

permissions:
  contents: read

concurrency:
  group: community-tools-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Generate and validate catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Validate requested revision
        id: requested
        env:
          DISPATCH_SHA: ${{ inputs.community_sha }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_DISPATCH_SHA: ${{ github.event.client_payload.community_sha }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) requested="$DISPATCH_SHA" ;;
            repository_dispatch) requested="$REPOSITORY_DISPATCH_SHA" ;;
            schedule) requested="" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ -n "$requested" && ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "community_sha must be an exact 40-character Git commit" >&2
            exit 1
          fi
          echo "revision=$requested" >> "$GITHUB_OUTPUT"

      - name: Check automation App configuration
        id: app-config
        env:
          APP_ID: ${{ secrets.FIREDRILL_CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FIREDRILL_CI_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Community Tool sync is idle until the Firedrill CI App credentials are configured."
          fi

      - name: Mint read-only community repository token
        id: source-token
        if: steps.app-config.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FIREDRILL_CI_APP_ID }}
          private-key: ${{ secrets.FIREDRILL_CI_APP_PRIVATE_KEY }}
          owner: firedrill-tools
          repositories: firedrill-community-tools
          permission-contents: read

      - name: Report unavailable community repository access
        if: steps.app-config.outputs.configured == 'true' && steps.source-token.outcome != 'success'
        run: echo "::notice::Community Tool sync is idle until the Firedrill CI App is installed on firedrill-community-tools."

      - name: Resolve exact community revision
        id: resolved
        if: steps.source-token.outcome == 'success'
        env:
          REQUESTED_REVISION: ${{ steps.requested.outputs.revision }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          revision="$REQUESTED_REVISION"
          if [[ -z "$revision" ]]; then
            revision="$(
              curl --fail --silent --show-error --retry 3 \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $SOURCE_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/firedrill-tools/firedrill-community-tools/git/ref/heads/main \
                | jq -er '.object.sha'
            )"
          fi
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved community revision is not an exact 40-character Git commit" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out consumer source
        if: steps.source-token.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact community source
        if: steps.source-token.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firedrill-tools/firedrill-community-tools
          ref: ${{ steps.resolved.outputs.revision }}
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
          path: community-tools-source

      - name: Verify immutable community checkout
        id: source
        if: steps.source-token.outcome == 'success'
        env:
          REQUESTED_REVISION: ${{ steps.resolved.outputs.revision }}
        run: |
          revision="$(git -C community-tools-source rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$revision" != "$REQUESTED_REVISION" ]]; then
            echo "Checked out $revision instead of $REQUESTED_REVISION" >&2
            exit 1
          fi
          test -z "$(git -C community-tools-source status --porcelain --untracked-files=all)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.source-token.outcome == 'success'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Install Node.js
        if: steps.source-token.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install consumer dependencies
        if: steps.source-token.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Build registry contract dependency
        if: steps.source-token.outcome == 'success'
        run: pnpm --filter @firedrill/contracts build

      - name: Generate exact catalog and run focused consumer checks
        if: steps.source-token.outcome == 'success'
        env:
          COMMUNITY_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          pnpm exec tsx tooling/generate-registry.mts \
            --source "$GITHUB_WORKSPACE/community-tools-source" \
            --revision "$COMMUNITY_REVISION"
          pnpm registry:check
          pnpm registry:test

      - name: Prepare data-only sync artifact
        if: steps.source-token.outcome == 'success'
        env:
          COMMUNITY_REVISION: ${{ steps.source.outputs.revision }}
        run: >-
          node .github/scripts/community-sync-artifact.mjs prepare
          --artifact "$RUNNER_TEMP/community-tools-sync"
          --revision "$COMMUNITY_REVISION"

      - name: Upload verified sync artifact
        if: steps.source-token.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-tools-catalog-${{ steps.source.outputs.revision }}
          path: ${{ runner.temp }}/community-tools-sync
          if-no-files-found: error
          retention-days: 2

      - name: Mark generated artifact ready
        id: ready
        if: steps.source-token.outcome == 'success'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  propose:
    name: Open catalog update pull request
    needs: validate
    if: needs.validate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check automation App configuration
        id: app-config
        env:
          APP_ID: ${{ secrets.FIREDRILL_CI_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FIREDRILL_CI_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Catalog was validated but no pull request can be opened until the Firedrill CI App credentials are configured."
          fi

      - name: Mint consumer pull-request token
        id: consumer-token
        if: steps.app-config.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FIREDRILL_CI_APP_ID }}
          private-key: ${{ secrets.FIREDRILL_CI_APP_PRIVATE_KEY }}
          owner: firedrill-tools
          repositories: firedrill
          permission-contents: write
          permission-pull-requests: write

      - name: Report unavailable consumer access
        if: steps.app-config.outputs.configured == 'true' && steps.consumer-token.outcome != 'success'
        run: echo "::notice::Catalog was validated but no pull request can be opened until the Firedrill CI App is installed on firedrill."

      - name: Check out trusted consumer source
        if: steps.consumer-token.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.consumer-token.outputs.token }}

      - name: Download generated artifact
        if: steps.consumer-token.outcome == 'success'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: community-tools-catalog-${{ needs.validate.outputs.revision }}
          path: ${{ runner.temp }}/community-tools-sync

      - name: Verify and apply generated catalog
        if: steps.consumer-token.outcome == 'success'
        env:
          COMMUNITY_REVISION: ${{ needs.validate.outputs.revision }}
        run: >-
          node .github/scripts/community-sync-artifact.mjs apply
          --artifact "$RUNNER_TEMP/community-tools-sync"
          --revision "$COMMUNITY_REVISION"

      - name: Commit generated catalog branch
        id: commit
        if: steps.consumer-token.outcome == 'success'
        env:
          BRANCH: automation/community-tools-sync
          COMMUNITY_REVISION: ${{ needs.validate.outputs.revision }}
          GH_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: |
          git add -- registry/index.json registry/README.md
          if git diff --cached --quiet; then
            existing="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                -f state=open \
                -f base=main \
                -f "head=$GITHUB_REPOSITORY_OWNER:$BRANCH" \
                --jq '.[0].number // empty'
            )"
            if [[ -n "$existing" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" -f state=closed >/dev/null
              echo "Closed obsolete pull request #$existing because the generated catalog already matches main"
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "firedrill-ci[bot]"
          git config user.email "firedrill-ci[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "chore: sync community Tools at ${COMMUNITY_REVISION:0:12}"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/$BRANCH:$remote_sha" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.consumer-token.outcome == 'success' && steps.commit.outputs.changed == 'true'
        env:
          BRANCH: automation/community-tools-sync
          COMMUNITY_REVISION: ${{ needs.validate.outputs.revision }}
          GH_TOKEN: ${{ steps.consumer-token.outputs.token }}
        run: |
          body="Imports generated catalog metadata from exact community Tool revision \`$COMMUNITY_REVISION\`. No Tool code executes in the privileged pull-request job. Review and merge normally after CI passes."
          existing="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f base=main \
              -f "head=$GITHUB_REPOSITORY_OWNER:$BRANCH" \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" \
              -f title="chore: sync community Tools" \
              -f body="$body" >/dev/null
            echo "Updated existing pull request #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync community Tools" \
            --body "$body"
