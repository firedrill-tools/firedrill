name: Release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: pnpm --filter @firedrill/browser-tests exec playwright install --with-deps chromium

      - name: Run the public framework gate
        run: pnpm check

      - name: Install the pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Prepare reproducible packages and SBOMs
        run: >-
          pnpm release:prepare --
          --output "${RUNNER_TEMP}/firedrill-release"
          --syft "${{ steps.syft.outputs.cmd }}"
          --require-clean

      - name: Attest package provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: '${{ runner.temp }}/firedrill-release/packages/*.tgz'

      - name: Attest package SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: '${{ runner.temp }}/firedrill-release/packages/*.tgz'
          sbom-path: '${{ runner.temp }}/firedrill-release/sbom/firedrill-runtime.spdx.json'

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firedrill-release-evidence
          path: '${{ runner.temp }}/firedrill-release/'
          if-no-files-found: error
          retention-days: 14
