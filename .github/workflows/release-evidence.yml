name: Release evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the public framework gate
        run: pnpm check

      - name: Install the pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.0

      - name: Prepare reproducible packages and SBOMs
        run: >-
          pnpm release:prepare --
          --output "${RUNNER_TEMP}/firedrill-release"
          --syft "${{ steps.syft.outputs.cmd }}"
          --require-clean

      - name: Attest package provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: '${{ runner.temp }}/firedrill-release/packages/*.tgz'

      - name: Attest package SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: '${{ runner.temp }}/firedrill-release/packages/*.tgz'
          sbom-path: '${{ runner.temp }}/firedrill-release/sbom/firedrill-runtime.spdx.json'

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firedrill-release-evidence
          path: '${{ runner.temp }}/firedrill-release/'
          if-no-files-found: error
          retention-days: 14
