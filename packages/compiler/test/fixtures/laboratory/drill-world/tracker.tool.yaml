schemaVersion: 1
module: ./tracker.ts
manifest:
  schemaVersion: 1
  id: sample-tracker
  version: 3.0.0
  engine: ">=0.1.0 <0.2.0"
  capabilities: [event.emit, state.read, state.write]
  state:
    - namespace: samples
      schema:
        type: object
        required: [status]
        properties:
          status:
            enum: [queued, processed]
        additionalProperties: false
    - namespace: audit
      schema:
        type: object
        required: [processed]
        properties:
          processed:
            type: boolean
        additionalProperties: false
  operations:
    - id: samples.process
      inputSchema:
        type: object
        required: [sampleId]
        properties:
          sampleId:
            type: string
        additionalProperties: false
      outputSchema:
        type: object
        required: [status]
        properties:
          status:
            const: processed
        additionalProperties: false
      idempotency: required
      fidelity: behavioral
    - id: samples.read
      inputSchema:
        type: object
        required: [sampleId]
        properties:
          sampleId:
            type: string
        additionalProperties: false
      outputSchema:
        type: object
        required: [status]
        properties:
          status:
            type: string
        additionalProperties: false
      idempotency: none
      fidelity: stateful
  events:
    - id: sample.processed
      payloadSchema:
        type: object
        required: [sampleId]
        properties:
          sampleId:
            type: string
        additionalProperties: false
  subscriptions:
    - id: record-processing
      event:
        packageId: sample-tracker
        eventId: sample.processed
