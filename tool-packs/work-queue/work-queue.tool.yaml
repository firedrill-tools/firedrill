schemaVersion: 1
module: ./dist/behavior.js
manifest:
  schemaVersion: 1
  id: work-queue
  version: 0.1.0-rc.1
  engine: ">=0.1.0 <0.2.0"
  capabilities:
    - event.emit
    - state.read
    - state.write
  state:
    - namespace: items
      schema:
        type: object
        required:
          - title
          - status
        properties:
          title:
            type: string
          status:
            type: string
            enum:
              - available
              - claimed
              - completed
          claimedBy:
            type: string
          result:
            type: string
        additionalProperties: false
      description: Work items visible to the agent.
  operations:
    - id: items.claim
      description: Assign one existing work item to the calling actor.
      inputSchema:
        type: object
        required:
          - id
        properties:
          id:
            type: string
        additionalProperties: false
      outputSchema:
        type: object
        required:
          - id
          - status
          - claimedBy
        properties:
          id:
            type: string
          status:
            type: string
            const: claimed
          claimedBy:
            type: string
        additionalProperties: false
      declaredErrors:
        - NOT_FOUND
      idempotency: required
      fidelity: stateful
    - id: items.complete
      description: Complete one existing work item and emit its completion event.
      inputSchema:
        type: object
        required:
          - id
        properties:
          id:
            type: string
          result:
            type: string
        additionalProperties: false
      outputSchema:
        type: object
        required:
          - id
          - status
        properties:
          id:
            type: string
          status:
            type: string
            const: completed
        additionalProperties: false
      declaredErrors:
        - NOT_FOUND
      idempotency: required
      fidelity: behavioral
    - id: items.list
      description: List work items, optionally filtered by status.
      inputSchema:
        type: object
        properties:
          status:
            type: string
            enum:
              - available
              - claimed
              - completed
          limit:
            type: integer
            minimum: 1
            maximum: 100
        additionalProperties: false
      outputSchema:
        type: object
        required:
          - items
        properties:
          items:
            type: array
            items:
              type: object
              required:
                - id
                - title
                - status
              properties:
                id:
                  type: string
                title:
                  type: string
                status:
                  type: string
                  enum:
                    - available
                    - claimed
                    - completed
                claimedBy:
                  type: string
                result:
                  type: string
              additionalProperties: false
        additionalProperties: false
      idempotency: none
      fidelity: stateful
  events:
    - id: item.completed
      payloadSchema:
        type: object
        required:
          - id
        properties:
          id:
            type: string
        additionalProperties: false
  http:
    - id: claim-item
      operationId: items.claim
      method: POST
      path: /api/work-items/{itemId}/claim
      auth:
        kind: basic
        token: password
        username: firedrill
      requestBody: none
      response:
        successStatus: 204
        errors:
          - code: NOT_FOUND
            status: 404
    - id: complete-item
      operationId: items.complete
      method: PATCH
      path: /api/work-items/{itemId}
      auth:
        kind: query
        name: access_token
      requestBody: text
      response:
        successStatus: 200
        errors:
          - code: NOT_FOUND
            status: 404
    - id: list-items
      operationId: items.list
      method: GET
      path: /api/work-items
      auth:
        kind: bearer
      requestBody: none
      response:
        successStatus: 200
        errors:
          []
